apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekton-pipelines-webhook
  labels:
    helmTemplateRemoveMe: |
      {{- with .Values.webhook.deployment.labels }}
        {{- toYaml . | nindent 4 }}
      {{- end}}
spec:
  template:
    metadata:
      labels:
        helmTemplateRemoveMe: |
          {{- with .Values.webhook.pod.labels }}
            {{- toYaml . | nindent 8 }}
          {{- end}}
    spec:
      imagePullSecrets:
        helmTemplateRemoveMe: |
          {{- with .Values.webhook.imagePullSecrets }}
            {{- toYaml . | nindent 6 }}
          {{- end }}
      affinity:
        helmTemplateRemoveMe: |
          {{- with .Values.webhook.affinity }}
            {{- toYaml . |  nindent 8 }}
          {{- end }}
      containers:
      - name: webhook
        envFrom:
        - secretRef:
            name: "{{ .Values.webhook.envFromSecret }}"
            optional: true
        resources:
          helmTemplateRemoveMe: |
            {{- toYaml  .Values.webhook.resources |  nindent 10 }}
      helmTemplateRemoveMe: |
        image: {{ .Values.webhook.deployment.image }}
      nodeSelector:
        helmTemplateRemoveMe: |
          {{- with .Values.webhook.nodeSelector }}
            {{- toYaml . |  nindent 8 }}
          {{- end}}
      tolerations:
        - helmTemplateRemoveMe: |
            {{- with .Values.webhook.tolerations }}
              {{- toYaml . |  nindent 6 }}
            {{- end}}
